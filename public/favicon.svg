<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background: brand near-black with rounded corners -->
  <rect width="512" height="512" rx="96" fill="#1A1A1A"/>
  <!-- Subtle radial glow -->
  <circle cx="256" cy="220" r="200" fill="url(#glow)" opacity="0.35"/>
  <!-- Brand "A" in Playfair-style — geometric serif letterform -->
  <path d="M256 108 L168 380 L196 380 L222 310 L290 310 L316 380 L344 380 Z M256 148 L283 290 L229 290 Z" fill="url(#gold)"/>
  <!-- Decorative crossbar accent -->
