  <!-- TM superscript mark -->
  <text x="338" y="145" font-family="Georgia, serif" font-size="38" font-weight="700" fill="#C8956C" opacity="0.9">™</text>
  <defs>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#C8956C"/>
      <stop offset="100%" stop-color="#1A1A1A"/>
    </radialGradient>
    <linearGradient id="gold" x1="168" y1="108" x2="344" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D4A853"/>
      <stop offset="50%" stop-color="#C8956C"/>
      <stop offset="100%" stop-color="#B87A5A"/>
    </linearGradient>
